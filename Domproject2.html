<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input placeholder = "Cost of order" class = "js-input" onkeydown = "
    handleCostKeyDown(event);
    ">

    <!-- onkeydown run js when we press a key down on our keyboard 
     
    clciks, keydowns = > events
    onclick, onkeydown => event listeners  check for events
     and run js when those events occur
     
     every eventlistener gets an event object-->
    <button onclick = "
        calculate();
    ">Calculate</button>
    <p class = "js-cost"></p>
    <script src = "Domproject2.js"></script>
</body>
</html>
