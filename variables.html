<body>
    <!-- Variable is like a container to store values.
     Syntax rules for variable:

     -> let, const, var creates a new variable and then we assign it a name.
     -> name restriction:
     -> Can't use special words/keywords:  Example: let
     -> Can't start a cariable name with a number, but can use in middle or in end
     -> Cant use special characters except $ and _

     -> = value: to store or to assign somethin ginside variable

     -> ;  end of an instruction

     -> but at last js inserts / assume ; automatically, so we do not mandatorily need ; in last 
    -->


    <!-- task1: -->

    <h3>Cart Quantity</h3>
    <button onclick = "
        console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>
    <button onclick = "
    cartQuantity = cartQuantity+1;
    console.log(`Cart quantity: ${cartQuantity}`);">Add to Cart</button>
    <button onclick = "
    cartQuantity = cartQuantity+2;
    console.log(`Cart quantity:${cartQuantity} `);">+2</button>
    <button onclick = "
    cartQuantity = cartQuantity+3;
    
    console.log(`Cart quantity:${cartQuantity} `);">+3</button>
    <button onclick = "
    cartQuantity = 0;

    console.log(`Cart quantity:${cartQuantity} `);">Reset Cart</button>


      <script>
        //let, const and var are identifiers:
        let variable1 = 33;  //assigning a value to a variable
        console.log(variable1);  //33

        let calculation = 2+2;
        console.log(calculation);  //4

        console.log(calculation+calculation*2);  //12


        let result = calculation+2;  //substitution
        console.log(result);


        let message = "Hello there, I'm Poorvi";
        console.log(message);


        variable1 = 45;  //reassignment -> rules: dont use the identifier, because we can't name a variable with existing name.
        console.log(variable1);


        variable1 = 23;  //multiple reassignment is possible;
        console.log(variable1);



        //incrementation
        variable1 = variable1+5;  //23+5 -> 28
        console.log(variable1)
        //or
        variable1+= 3;  //28+3-> 31
        console.log(variable1);



        // Task1:

        let cartQuantity = 0;  //camelCase naming convention  


        // second way of craeting a variable:
        const variable2 = 3;
        //dconst value remains constant we can't teassign them
        // variable2 = 5; //gives error


        //Best practice is to use const by default and only use let when we need to change the value.

        //third way: var
        var variable3 = 55;
        //reassignable, original way, have some issues that's why we don't use it.

        //we can use typeof with variables to get to know their data type:
        console.log(typeof variable3);
        console.log(typeof message);

      </script>
